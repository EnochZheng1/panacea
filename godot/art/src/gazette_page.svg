            <div class="sm">Write to Mrs. Whittle in strictest confidence. She answers every letter personally.</div>
            <div class="fine">Mrs. Whittle's correspondence continues brisk, notwithstanding her funeral in March.</div>
          </div>
          <div class="ad">
            <div class="mid">BEAUTY!</div>
            <div class="big" style="font-size:19px">MADAME DE LA ROSE'S<br/>ARSENICAL COMPLEXION WAFERS</div>
            <svg xmlns="http://www.w3.org/2000/svg" class="stock" viewBox="0 0 86 104">
              <ellipse cx="43" cy="52" rx="40" ry="50" fill="none" stroke="#161112" stroke-width="2.4"/>
              <path d="M22,98 C22,78 32,70 43,70 C54,70 64,78 64,98 Z" fill="#161112"/>
              <circle cx="43" cy="48" r="16" fill="#f0c4bd" stroke="#161112" stroke-width="2.2"/>
              <path d="M27,46 C26,30 36,24 44,25 C54,26 61,33 59,46 C55,38 48,34 43,35 C37,35 31,40 27,46 Z" fill="#161112"/>
              <circle cx="56" cy="27" r="7" fill="#161112"/>
              <path d="M37,48 C38,49 40,49 41,48 M46,48 C47,49 49,49 50,48 M39,55 C42,58 46,58 48,55" fill="none" stroke="#161112" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M30,74 L56,74 M28,82 L58,82 M27,90 L59,90" stroke="#f0c4bd" stroke-width="1.6"/>
            </svg>
            <div class="sm">A Skin of Alabaster! Perfectly Safe! Ladies of Fashion take three daily.</div>
            <div class="fine">The portrait above is used by kind permission of Mrs. Whittle, who did not object.</div>
          </div>
          <div class="ad black">
            <div class="big" style="font-size:22px">FOGG &amp; SONS,</div>
            <div class="mid">UNDERTAKERS.</div>
            <div class="sm">Coffins in All Sizes, Ready Made. We Thank Our Friends in the Medicine Trade for Their Continued Patronage. Terms by the Dozen.</div>
          </div>
        </div>
      </div>

      <div class="markets"><b>THE MARKETS.</b>Laudanum, firm. Opium, steady at $4.10. Calomel, active. Whisky (medicinal), brisk. Coffins, pine, up two cents; oak, unchanged. Lilies, scarce.</div>
    </div>
  </foreignObject>

