              <path d="M14,52 C14,42 22,38 26,36 L26,20 L34,20 L34,36 C38,38 46,42 46,52 L46,140 C46,145 42,148 38,148 L22,148 C18,148 14,145 14,140 Z" fill="#161112"/>
              <path d="M19,60 L19,138 L41,138 L41,60 Z" fill="#23a862"/>
              <path d="M17,78 L43,78 L43,116 L17,116 Z" fill="#f0c4bd" stroke="#161112" stroke-width="1.5"/>
              <path d="M21,86 H39 M21,94 H39 M23,102 H37 M24,108 H36" stroke="#161112" stroke-width="2"/>
              <path d="M24,8 L36,8 L35,20 L25,20 Z" fill="#161112"/>
              <path d="M22,64 L22,134" stroke="#f0c4bd" stroke-width="2" opacity="0.7"/>
            </svg>
            <div class="owntext">
              <div class="big">DR. ——'S CELEBRATED PANACEA</div>
              <div class="mid">CURES CONSUMPTION · CATARRH · DYSPEPSIA · MELANCHOLY · FEMALE COMPLAINTS · &amp; ALL ILLS</div>
              <div class="sm"><span class="hand">☞</span> Endorsed by Clergymen. Prescribed by Physicians. Results Permanent.</div>
              <div class="fine">BEWARE OF IMITATIONS! None genuine without the Doctor's signature, which he will supply on request.</div>
            </div>
          </div>
        </div>

        <div class="col">
          <div class="ad">
            <div class="big">DR. GRIMSBY'S<br/>GALVANIC BELT</div>
            <div class="mid">RESTORES LOST VIGOR</div>
            <div class="sm">Worn next the skin. A Current of Health through every Nerve! Sent on thirty days' trial.</div>
            <div class="fine">Wearers are requested not to stand in puddles.</div>
          </div>
          <div class="ad">
            <div class="mid">LADIES!</div>
            <div class="big" style="font-size:20px">MRS. PRUDENCE WHITTLE'S<br/>VEGETABLE COMPOUND</div>
            <svg xmlns="http://www.w3.org/2000/svg" class="stock" viewBox="0 0 86 104">
              <ellipse cx="43" cy="52" rx="40" ry="50" fill="none" stroke="#161112" stroke-width="2.4"/>
              <path d="M22,98 C22,78 32,70 43,70 C54,70 64,78 64,98 Z" fill="#161112"/>
              <circle cx="43" cy="48" r="16" fill="#f0c4bd" stroke="#161112" stroke-width="2.2"/>
              <path d="M27,46 C26,30 36,24 44,25 C54,26 61,33 59,46 C55,38 48,34 43,35 C37,35 31,40 27,46 Z" fill="#161112"/>
              <circle cx="56" cy="27" r="7" fill="#161112"/>
              <path d="M37,48 C38,49 40,49 41,48 M46,48 C47,49 49,49 50,48 M39,55 C42,58 46,58 48,55" fill="none" stroke="#161112" stroke-width="1.4" stroke-linecap="round"/>
              <path d="M30,74 L56,74 M28,82 L58,82 M27,90 L59,90" stroke="#f0c4bd" stroke-width="1.6"/>
