        <path d="M58,174 L178,160 L184,170 L62,184 Z" class="k"/>
      </g>
    </g>
    <g>
      <path d="M90,214 L96,190 L128,180 L150,186 L154,212 L150,240 L142,270 L128,298 L106,296 L94,282 L90,258 Z" class="bone"/>
      <path d="M154,212 L164,214 L160,244 L148,276 L142,270 L150,240 Z" class="mid"/>
      <path d="M56,364 L70,326 L84,322 L72,380 L66,470 L74,700 L64,866 L58,866 L66,700 L60,470 Z" class="bone"/>
      <path d="M170,236 L176,206 L182,206 L178,240 Z" class="mid"/>
    </g>
    <g>
      <path d="M100,222 L126,217 L126,240 L112,247 L100,240 Z M134,215 L156,211 L156,233 L142,240 L134,234 Z" fill="url(#lamp)"/>
      <path d="M124,250 L133,268 L118,268 Z" fill="url(#lamp)"/>
      <path d="M100,276 L152,272 L146,292 L106,294 Z" class="k"/>
    </g>
    <g fill="url(#lamp)">
