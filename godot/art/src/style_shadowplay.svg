    <path d="M172,196 L196,196 L196,206 L172,206 Z" class="bone"/>
    <path d="M176,170 L198,168 L200,194 L178,196 Z" class="bone"/>
    <path d="M178,180 L198,178 M178,188 L199,186" class="line" stroke-width="1.3"/>
    <!-- notebook and pencil: he is writing the number down -->
    <g>
