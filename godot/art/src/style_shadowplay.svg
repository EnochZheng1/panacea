      <path d="M240,250 C240,186 278,162 320,162 C364,162 400,188 400,250 C400,304 372,344 320,346 C270,344 240,304 240,250 Z" class="k"/>
      <path d="M244,234 C224,224 218,262 228,282 C234,294 248,290 250,280 Z M396,234 C416,224 422,262 412,282 C406,294 392,290 390,280 Z" class="k"/>
    </g>
    <g>
