      <path d="M407,266 L407,316 L433,316 L433,266 Q433,256 425,253 L415,253 Q407,256 407,266 Z" fill="url(#liquid)"/>
      <path d="M410,276 L430,276 L430,300 L410,300 Z" fill="url(#lamp)"/>
      <text x="420" y="290" font-family="Fell" font-size="6" text-anchor="middle" fill="#120e0c">PANACEA</text>
      <path d="M415,216 L425,216 L426,230 L414,230 Z" class="k"/>
    </g>
    <path d="M400,300 L438,296 L440,312 L402,318 Z M402,320 L436,318 L436,332 L404,334 Z" class="bone"/>
    <path d="M400,300 L438,296 L440,312 L402,318 Z M402,320 L436,318 L436,332 L404,334 Z" class="line" stroke-width="1.4"/>
