      <rect x="127" y="276" width="5" height="9"/><rect x="134" y="276" width="5" height="8"/><rect x="141" y="275" width="5" height="8"/>
    </g>
    <circle cx="122" cy="226" r="3" fill="#0d0a08"/><circle cx="153" cy="221" r="2.6" fill="#0d0a08"/>
