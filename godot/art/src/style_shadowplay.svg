      <path d="M248,250 C248,194 282,170 320,170 C360,170 392,194 392,250 C392,300 368,338 320,338 C274,336 248,300 248,250 Z" class="bone"/>
      <path d="M358,176 C384,190 392,220 392,250 C392,296 372,330 344,336 C364,310 372,280 370,250 C368,214 364,192 358,176 Z" class="mid"/>
