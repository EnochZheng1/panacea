      <path d="M86,420 L122,414 M87,428 L118,423 M88,436 L124,430" class="line" stroke-width="1"/>
      <path d="M128,392 L146,440" stroke="#120e0c" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M132,436 L156,430 L160,448 L138,454 Z" class="bone"/>
    </g>
  </g>

