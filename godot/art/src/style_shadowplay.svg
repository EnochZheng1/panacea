    <g id="arm-bottle">
      <path d="M372,404 C398,412 424,450 434,498 C438,512 430,518 420,512 C414,480 400,450 384,440 Z" class="bone"/>
      <path d="M420,512 C434,516 440,500 436,470 L428,332 L406,332 L412,470 C414,490 416,504 420,512 Z" class="bone"/>
      <path d="M372,404 C398,412 424,450 434,498 C438,512 430,518 420,512 M436,470 L428,332 M406,332 L412,470" class="line"/>
      <path d="M428,340 L436,470 L432,500" stroke="#3fe08f" stroke-width="3" fill="none" opacity="0.7"/>
      <path d="M400,430 L416,422 L424,436 L408,444 Z" class="k"/>
