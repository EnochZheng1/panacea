      <path d="M296,880 L306,880 L306,896 L274,896 L276,884 Z M336,884 L366,880 L368,896 L338,896 Z" class="bone"/>
      <path d="M266,660 L276,660 L278,890 L272,890 Z" class="mid"/>
    </g>
    <path d="M384,212 C392,234 394,262 388,290 C384,306 376,320 366,328 L360,322 C374,302 382,278 382,250 C382,236 380,222 377,212 Z" class="green" opacity="0.85"/>
    <path d="M398,244 C410,240 412,262 406,276 L400,272 Z" class="green" opacity="0.7"/>

    <g>
      <!-- three loyal hairs -->
      <path d="M282,180 C300,160 340,160 358,178 M288,186 C306,170 336,170 352,186 M294,190 C310,180 332,180 346,190" class="line" stroke-width="1.6"/>
      <!-- a bead of sweat -->
      <path d="M268,204 C263,213 263,220 268,223 C273,220 273,213 268,204 Z" fill="url(#lamp)" stroke="#120e0c" stroke-width="1.4"/>
      <path d="M270,220 C280,204 298,204 308,214 M332,214 C342,204 360,204 370,220" class="line" stroke-width="3"/>
      <ellipse cx="290" cy="246" rx="20" ry="23" fill="url(#lamp)" stroke="#120e0c" stroke-width="2.6"/>
      <ellipse cx="350" cy="246" rx="20" ry="23" fill="url(#lamp)" stroke="#120e0c" stroke-width="2.6"/>
      <path d="M270,268 C284,280 300,280 310,268 C302,284 282,286 270,268 Z M330,268 C342,280 358,280 370,268 C360,284 340,286 330,268 Z" class="k"/>
      <path d="M258,276 C264,300 276,312 288,318 C276,300 270,288 268,272 Z M382,276 C376,300 364,312 352,318 C364,300 370,288 372,272 Z" class="k" opacity="0.75"/>
      <path d="M321,238 L313,280 C318,287 327,287 331,282" class="line" stroke-width="2"/>
      <path d="M266,292 C290,320 350,320 374,292 C368,324 348,336 320,338 C292,336 272,324 266,292 Z" class="k"/>
      <path d="M274,298 C296,314 344,314 366,298 L362,307 C342,319 298,319 278,307 Z" fill="url(#lamp)"/>
      <path d="M286,304 L287,312 M298,307 L298,316 M310,309 L310,317 M322,309 L322,317 M334,308 L334,316 M346,306 L345,314 M356,302 L355,310" class="line" stroke-width="1.3"/>
    </g>
    <circle cx="291" cy="247" r="2" class="k"/><circle cx="349" cy="247" r="2" class="k"/>

    <g>
      <!-- the collar is a size too big now -->
      <path d="M280,370 L360,370 L364,398 L276,398 Z" class="bone"/>
      <path d="M296,371 L344,371 L340,382 L300,382 Z" class="k"/>
      <path d="M280,370 L360,370 L364,398 L276,398 Z" class="line" stroke-width="1.8"/>
      <ellipse cx="320" cy="360" rx="4" ry="5" class="bone"/>
