    <path d="M186,176 L186,900 M197,176 L197,900" class="line" stroke-width="1.2"/>
    <path id="ticks" d="M186,176 L195,176 M186,188 L191,188 M186,200 L191,200 M186,212 L191,212 M186,224 L191,224 M186,236 L195,236 M186,248 L191,248 M186,260 L191,260 M186,272 L191,272 M186,284 L191,284 M186,296 L195,296 M186,308 L191,308 M186,320 L191,320 M186,332 L191,332 M186,344 L191,344 M186,356 L195,356 M186,368 L191,368 M186,380 L191,380 M186,392 L191,392 M186,404 L191,404 M186,416 L195,416 M186,428 L191,428 M186,440 L191,440 M186,452 L191,452 M186,464 L191,464 M186,476 L195,476 M186,488 L191,488 M186,500 L191,500 M186,512 L191,512 M186,524 L191,524 M186,536 L195,536 M186,548 L191,548 M186,560 L191,560 M186,572 L191,572 M186,584 L191,584 M186,596 L195,596 M186,608 L191,608 M186,620 L191,620 M186,632 L191,632 M186,644 L191,644 M186,656 L195,656 M186,668 L191,668 M186,680 L191,680 M186,692 L191,692 M186,704 L191,704 M186,716 L195,716 M186,728 L191,728 M186,740 L191,740 M186,752 L191,752 M186,764 L191,764 M186,776 L195,776 M186,788 L191,788 M186,800 L191,800 M186,812 L191,812 M186,824 L191,824 M186,836 L195,836 M186,848 L191,848 M186,860 L191,860 M186,872 L191,872" fill="none" stroke="url(#lamp)" stroke-width="1.6"/>
    <circle cx="196" cy="894" r="16" class="k"/>
    <circle cx="196" cy="894" r="6" class="bone"/>
  </g>

  <!-- ===== the satisfied customer ===== -->
  <g id="customer">
    <g>
      <path d="M262,652 L318,660 L306,898 L274,898 Z M322,660 L380,652 L368,898 L336,898 Z" class="k"/>
      <path d="M262,896 L310,896 L312,914 L244,914 Z M332,896 L380,896 L396,914 L330,914 Z" class="k"/>
