      <path d="M242,450 L264,444 L264,456 L242,462 Z" class="k"/>
      <path d="M280,452 L312,444 L318,470 L288,480 Z" class="bone"/>
      <path d="M280,452 L312,444 L318,470 L288,480 Z M292,450 L298,476 M302,447 L308,474" class="line" stroke-width="1.4"/>
    </g>

