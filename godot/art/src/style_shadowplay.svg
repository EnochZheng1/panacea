    </g>

    <!-- hand on heart for the testimonial -->
    <g id="arm-heart">
      <path d="M262,404 C244,420 234,470 236,520 C244,532 262,520 280,490 L292,470 L280,452 C268,470 258,480 252,486 C256,460 262,440 270,420 Z" class="bone"/>
