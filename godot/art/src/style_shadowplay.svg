      <path d="M160,318 L192,326 L198,240 L192,198 L174,198 L168,240 Z" class="k"/>
      <path d="M84,214 L92,184 L128,172 L160,180 L172,206 L170,240 L156,270 L150,290 L130,306 L104,304 L90,286 L84,260 Z" class="k"/>
