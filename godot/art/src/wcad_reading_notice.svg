      <h3>A MINISTER'S TESTIMONY.</h3>
      <div class="sep"></div>
      <div class="deck a">Restored to the Pulpit.</div>
      <div class="sep"></div>
      <div class="deck b">THE REV. JOSIAH PEABODY, OF THE FIFTH STREET CHAPEL, NOW PREACHES FOUR SERMONS EVERY SUNDAY, AND CANNOT BE STOPPED.</div>
      <div class="sep"></div>
      <div class="deck c">His Congregation Astonished.</div>
      <img class="cut" src="../../assets/art/cuts/wc_proprietor.png"/>
      <div class="cutline">THE REV. MR. PEABODY.—From a stock likeness.</div>
      <p class="drop">For some years the Rev. Josiah Peabody had been troubled with a weakness of the throat, a languor of the spirit, and a congregation that slept through the second hour. His physician could do nothing for any of the three.</p>
      <p>A member of his flock, since departed, pressed upon him a bottle of Dr. ——'s Celebrated Panacea. He now takes a tablespoonful before each sermon and two during it. He has not sat down since Michaelmas.</p>
      <p>The chapel is full every Sunday. The congregation comes, it is said, to learn what he will say next. Sold by all druggists.—<i>Adv.</i></p>
