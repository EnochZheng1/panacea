      <style>
        .al { box-sizing: border-box; width: 700px; height: 1000px; padding: 22px 34px; color: #141212; font-family: Fell, serif; }
        .al * { margin: 0; box-sizing: border-box; }
        .top { display: grid; grid-template-columns: 110px 1fr 110px; align-items: center; border-bottom: 4px solid #141212; padding-bottom: 8px; }
        .top img { width: 90px; height: 120px; object-fit: contain; }
        .title { text-align: center; }
        .title .s { font-size: 14px; letter-spacing: 3px; }
        .title .b { font-family: Rye; font-size: 32px; line-height: 1.05; }
        .title .y { font-family: FellIt; font-size: 18px; }
        .month { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.4px solid #141212; padding: 6px 2px 4px; }
        .month b { font-family: Rye; font-weight: normal; font-size: 30px; letter-spacing: 3px; }
        .month span { font-family: FellIt; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 13.4px; margin-top: 3px; }
        td { padding: 1.6px 4px; border-bottom: 0.8px solid rgba(20,18,18,0.35); vertical-align: top; }
        td.d { width: 34px; text-align: right; font-family: Rye; font-size: 15px; }
