        tr.sun td { font-weight: normal; background: rgba(20,18,18,0.08); }
        .foot { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 10px; border-top: 4px solid #141212; padding-top: 8px; font-size: 13.5px; line-height: 1.25; }
        .foot h4 { font-family: Rye; font-weight: normal; font-size: 16px; letter-spacing: 1.5px; text-align: center; margin-bottom: 4px; }
