      <path class="ln" d="M56,0 C66,-12 82,-10 84,2 C86,14 72,20 62,14 Z M78,18 C90,8 104,12 104,24 C102,36 88,38 80,30 Z" stroke-width="2.2"/>
    </g>
  </g>
