  <g id="backdrop"><rect width="700" height="900" fill="#f0c4bd" filter="url(#paper)"/></g>
  <foreignObject x="0" y="0" width="700" height="900" filter="url(#soft)">
    <div xmlns="http://www.w3.org/1999/xhtml" class="t">
      <style>
        .t { box-sizing: border-box; width: 700px; height: 900px; padding: 22px; color: #161112; font-family: Fell, serif; }
        .t * { margin: 0; box-sizing: border-box; }
        .box { height: 100%; border: 3px double #161112; border-width: 6px; padding: 22px 30px; text-align: center; }
        h1 { font-family: Rye; font-weight: normal; font-size: 58px; line-height: 1; }
        .sub { font-family: FellIt; font-size: 20px; margin: 4px 0 14px; }
        .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
        .oval { width: 250px; height: 310px; margin: 0 auto; border-radius: 50%; border: 4px solid #161112; overflow: hidden;
                background: repeating-linear-gradient(0deg, transparent 0 5px, rgba(22,17,18,0.25) 5px 6.4px); position: relative; }
        .oval img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
        .after .oval { border: 16px solid #161112; }
        .lab { font-family: Rye; font-size: 26px; margin-top: 8px; }
        .note { font-family: FellIt; font-size: 15px; }
        .bow { position: absolute; }
        .letter { text-align: justify; font-size: 16px; line-height: 1.3; margin-top: 16px; padding: 12px 14px; border-top: 1.4px solid #161112; border-bottom: 1.4px solid #161112; }
        .letter i { font-family: FellIt; font-style: normal; }
        .signed { text-align: right; font-size: 15px; letter-spacing: 1.2px; margin-top: 6px; }
        .fine { font-family: FellIt; font-size: 13px; margin-top: 10px; }
      </style>
      <div class="box">
        <h1>BEFORE &amp; AFTER!</h1>
        <div class="sub">A Remarkable Transformation, Attested by the Patient Himself.</div>
        <div class="pair">
          <div class="before">
            <div class="oval"><img src="../../assets/art/cuts/wc_clerk_bust.png"/></div>
            <div class="lab">BEFORE.</div>
            <div class="note">Catarrh, melancholy, and a persistent cough.</div>
          </div>
          <div class="after">
            <div class="oval"><img src="../../assets/art/cuts/wc_clerk_bust.png"/></div>
            <div class="lab">AFTER.</div>
            <div class="note">The cough has entirely ceased.</div>
          </div>
        </div>
        <div class="letter"><i>Dear Doctor,</i>—I write to say that after three bottles of your Panacea I am a new man. I sleep a great deal. My appetite has quite gone, which is a saving. Friends tell me I have never looked so peaceful. I mean to write again next week.</div>
        <div class="signed">ALBERT PIKE, CLERK, MULBERRY STREET.</div>
        <div class="fine">Mr. Pike did not write again. Dr. —— regrets that he cannot reply to every letter.</div>
      </div>
    </div>
  </foreignObject>
