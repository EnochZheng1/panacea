  <g id="backdrop">
    <rect width="500" height="800" fill="#2a2020"/>
    <rect x="10" y="10" width="480" height="780" rx="22" fill="#efe2c6" filter="url(#paper)"/>
  </g>
  <foreignObject x="10" y="10" width="480" height="780" filter="url(#soft)">
    <div xmlns="http://www.w3.org/1999/xhtml" class="tc">
      <style>
        .tc { box-sizing: border-box; width: 480px; height: 780px; padding: 18px; color: #161112; font-family: Fell, serif; }
        .tc * { margin: 0; box-sizing: border-box; }
        .frame { height: 100%; border: 5px solid #161112; border-radius: 14px; padding: 16px 18px; text-align: center;
                 background: radial-gradient(circle at 50% 45%, rgba(35,168,98,0.0) 0 120px, transparent 121px); }
        .over { font-family: FellIt; font-size: 19px; }
        .t1 { font-family: Rye; font-size: 40px; line-height: 1; margin-top: 4px; }
        .t2 { font-family: Rye; font-size: 52px; line-height: 1; color: #23a862; -webkit-text-stroke: 1.6px #161112; }
        .pic { position: relative; height: 410px; margin: 6px 0; }
        .pic img { height: 410px; width: 100%; object-fit: contain; position: relative; }
        .sun { position: absolute; left: 50%; top: 46%; width: 330px; height: 330px; transform: translate(-50%,-50%);
               background: repeating-conic-gradient(rgba(35,168,98,0.85) 0 6deg, transparent 6deg 20deg); border-radius: 50%; }
        .slogan { font-family: Rye; font-size: 24px; white-space: nowrap; }
        .sub { font-family: FellIt; font-size: 17px; }
        .imprint { margin-top: 12px; border-top: 1.4px solid #161112; padding-top: 6px; font-size: 13px; letter-spacing: 1.5px; }
        .imprint .blank { display: inline-block; width: 170px; border-bottom: 1.2px solid #161112; height: 14px; vertical-align: bottom; }
      </style>
      <div class="frame">
        <div class="over">Compliments of the Season!</div>
        <div class="t1">TEMPERANCE</div>
        <div class="t2">BITTERS</div>
        <div class="pic"><div class="sun"></div><img src="../../assets/art/cuts/wc_longshoreman.png"/></div>
        <div class="slogan">THE STRENGTH OF TEN MEN!</div>
        <div class="sub">And the breath of twelve.</div>
        <div class="imprint">SOLD BY <span class="blank"></span> DRUGGIST</div>
      </div>
    </div>
  </foreignObject>
